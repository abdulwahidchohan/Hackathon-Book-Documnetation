services:
  - type: web
    name: robotics-book-rag-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://hackathon-book-documnetation.vercel.app

